[project]
name = "kjac-backend"
version = "0.1.0"
description = "KJAC FastAPI backend — single unified API for React web + Flutter mobile (Supabase Auth only)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.8",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "supabase>=2.12",
  "httpx>=0.28",
  "python-jose[cryptography]>=3.3",
  "tenacity>=9.0",
  "slowapi>=0.1.9",
  "Pillow>=11",
  "python-multipart>=0.0.18",
  "openpyxl>=3.1",
  "tzdata>=2024; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.26",
  "httpx>=0.28",
  "aiosqlite>=0.20",
  "psycopg2-binary>=2.9",
  "ruff>=0.9",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
